[project]
name = "mazegen"
version = "0.1.0"
description = "A reusable maze generation library with multiple algorithms"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Neuza Nascimento", email = "nedo-nas@student.42porto.com"},
	{name = "Rodrigo Pereira", email = "rodrpere@student.42porto.com"}

]

keywords = ["maze", "generator", "algorithm", "pathfinding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.3.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "flake8", "flake8-pyproject"]

[project.scripts]
mazegen = "mazegen:main"

[build-system]
requires = ["uv_build >= 0.12.5, <0.13.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]
