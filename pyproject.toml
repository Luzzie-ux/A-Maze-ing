[project]
name = "amazing"
version = "0.1.0"
description = "A reusable maze generation library with multiple algorithms"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    {name = "Neuza Nascimento", email = "nedo-nas@student.42porto.com"},
	{name = "Rodrigo Pereira", email = "rodrpere@student.42porto.com"}

]

dependencies = [
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]
